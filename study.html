<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>study page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>welcome to study page</h1>
    <nav>
      <button id="about">about</button>
    </nav>
  </header>

  <main>
    <table border="2" cellpadding="20">
      <tr>
        <td width="150" height="150" align="center">
          <a href="dsa.html">DSA BOOKS</a>
            <h3>DSA</h3>
            <p>Data structures and algorithms</p>
          </a>
        </td>

        <td width="150" height="150" align="center">
          <a href="multimedia.html"> FMT BOOKS</a>
            <h3>Multimedia</h3>
            <p>Graphics, audio and video</p>
          </a>
        </td>
      </tr>
    </table>

    <section>
      <h2>Upload a PDF</h2>
      <input type="file" id="pdfInput" accept="application/pdf">
      <p id="fileName"></p>
      <iframe id="pdfPreview" width="100%" height="600" style="display:none;"></iframe>
    </section>
  </main>

  <footer>
    <!-- footer content -->
  </footer>

  <script>
    const input = document.getElementById("pdfInput");
    const nameText = document.getElementById("fileName");
    const preview = document.getElementById("pdfPreview");

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;

      if (file.type !== "application/pdf") {
        nameText.textContent = "Please choose a PDF file.";
        preview.style.display = "none";
        return;
      }

      nameText.textContent = "Selected: " + file.name;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });
  </script>
</body>
</html>
